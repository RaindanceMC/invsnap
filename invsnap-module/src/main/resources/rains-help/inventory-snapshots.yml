id: inventory-snapshots
title: Inventory snapshots
summary: How your inventory is saved automatically, and how staff browse and restore it after a bad death.
intro: |
  A quiet safety net: the server keeps looking at what you carry, so an accident can be undone. You do nothing — staff do the undoing.
icon: CHEST
category: Items & enchantments
order: 61
module: invsnap
aliases: [snapshot, snapshots, invsnap, restore, rollback, restore-inventory]
keywords: [inventory, backup, died, lost, items, undo]
commands: [invsnap]
related: [inventory-insurance]
sections:
  - question: Is my inventory saved somewhere?
    title: What gets saved
    text: |
      Yes. {if:invsnap:snapshot.only-on-death}A snapshot of your inventory is taken the instant before you die — only then.{else}A snapshot is taken every {setting:invsnap:snapshot.interval-seconds|seconds} while you are online, when you log off, and the instant before you die.{/if}
      {if:invsnap:snapshot.retention-days > 0}Snapshots are kept for {setting:invsnap:snapshot.retention-days|days} at most, and{else}Snapshots are kept until{/if} the newest {setting:invsnap:snapshot.retention-count|count} are all that remain — older ones make room.
  - question: I lost my items. What now?
    title: Lost items
    text: |
      Ask a staff member. A snapshot is a copy of what you carried, so they can give back a single lost item, or restore the whole inventory — but only while you are online, and a whole restore replaces what you carry at that moment. Tell them roughly <i>when</i> it happened.
  - question: How do I browse someone's snapshots?
    title: Browsing
    permission: rainsinvsnap.invsnap.browse
    text: |
      {run:/invsnap} opens the picker; {cmd:/invsnap <player>} goes straight to one player's history, online or not. Pick a snapshot to inspect every item as it was, or compare it slot by slot with what the player carries right now.
      The player can be a name or a selector; if it matches more than one person you are asked to pick one.
  - question: How do I restore a snapshot?
    title: Restoring
    permission: rainsinvsnap.invsnap.restore
    text: |
      Open the snapshot and click <white>Restore</white>, then confirm. The player must be online, and whatever they carry now is replaced by the snapshot. Compare first if you are unsure — it shows what differs.
      Only one item lost? Click <white>Inspect</white> (or <white>Compare to now</white>) and click that item, then confirm: just that one goes back, on top of what they carry, and nothing is replaced. If their inventory is full, nothing is given and you are told so.
